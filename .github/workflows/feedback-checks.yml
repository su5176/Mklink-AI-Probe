name: Feedback checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedback-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  feedback-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        shell: pwsh
        working-directory: Mklink-AI-Probe
        run: ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('-m', 'pip', 'install', 'pytest==8.4.2')
      - name: Check feedback queue and public Skill boundary
        shell: pwsh
        working-directory: Mklink-AI-Probe
        run: |
          ./scripts/build_workspace.ps1 -Action run -Executable python -ArgumentList @('-m', 'pytest', '-q', '_maintainer/testing/tests/test_issue_queue.py', '_maintainer/testing/tests/test_skill_context_boundaries.py', '--junitxml=../.build/reports/feedback-tests.xml')
      - name: Attach test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: feedback-test-report
          path: .build/reports/feedback-tests.xml
          if-no-files-found: warn
          retention-days: 14
