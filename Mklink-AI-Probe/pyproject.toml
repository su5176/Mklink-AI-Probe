[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mklink"
version = "0.1.8"
description = "Mklink AI Probe - Embedded Debug Toolkit"
requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "pymodbus>=3.0",
    "pyelftools==0.32",
    "pycparser>=2.22,<4",
    "websockets>=11.0",
]

[project.scripts]
mklink = "mklink.cli:main"
mklink-remote = "mklink.remote.cli:main"
mklink-remote-agent = "mklink.remote.cli:agent_main"
mklink-site-agent = "mklink.remote.package_agent:main"
mklink-remote-mcp = "mklink.remote.mcp:main"

[project.optional-dependencies]
remote = ["websockets>=11.0", "intelhex>=2.3"]
gui = [
    "fastapi>=0.100",
    "starlette>=0.40,<0.47",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "pyocd>=0.44,<0.45",
    "intelhex>=2.3",
    "python-multipart>=0.0.9",
]
test = ["pytest", "httpx>=0.27,<1", "pyinstaller==6.18.0"]
e2e = ["pytest", "playwright"]
hil = ["pytest", "playwright", "requests"]
mcp = ["fastmcp>=2.0", "pydantic<2.13"]
site-agent-build = [
    "build==1.5.0",
    "pyinstaller==6.18.0",
    "setuptools==80.9.0",
    "wheel==0.45.1",
]

[tool.pytest.ini_options]
testpaths = ["_maintainer/testing/tests"]
pythonpath = [".", "_maintainer/testing", "_maintainer/testing/tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mklink*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"mklink" = ["*.json", "modbus/*.html", "modbus/profiles/*.json", "modbus/prompts/*.md"]
